<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>aaRgh — Offline R &amp; swirl</title>
  <style>
    /* Default: Sleek High-Contrast Light Mode */
    :root, [data-theme="light"] {
      --bg: #f8fafc;
      --panel: #ffffff;
      --bar-bg: #f1f5f9;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --accent: #0284c7;
      --accent-fg: #ffffff;
      --cmd: #15803d;
      --prompt-bg: #e0f2fe;
      --prompt-fg: #0369a1;
      --err: #dc2626;
      --chip-bg: #e2e8f0;
      --chip-fg: #0f172a;
      --key-bg: #ffffff;
    }

    /* Optional Dark Mode */
    [data-theme="dark"] {
      --bg: #0f1419;
      --panel: #182026;
      --bar-bg: #12181f;
      --border: #2a3540;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #38bdf8;
      --accent-fg: #000000;
      --cmd: #4ade80;
      --prompt-bg: #1e293b;
      --prompt-fg: #7dd3fc;
      --err: #f87171;
      --chip-bg: #212c35;
      --chip-fg: #79c0ff;
      --key-bg: #212c35;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Roboto, sans-serif;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Disabled / Boot-Locked Controls */
    button:disabled,
    input:disabled,
    .boot-locked {
      opacity: 0.45 !important;
      pointer-events: none !important;
      cursor: not-allowed !important;
    }

    /* Persistent Single-Row Top Bar (Never Wraps or Overlaps) */
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      height: 44px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .brand {
      font-family: ui-monospace, monospace;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      display: inline-block;
    }
    .status-dot.ready { background: #16a34a; }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      flex-wrap: nowrap;
      white-space: nowrap;
      scrollbar-width: none;
      padding: 2px 0;
    }
    .top-actions::-webkit-scrollbar { display: none; }

    .top-btn {
      background: var(--bar-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      height: 30px;
      padding: 0 8px;
      font-family: ui-monospace, monospace;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .top-btn:active { background: var(--accent); color: var(--accent-fg); }
    .top-btn.plot-ready { border-color: var(--accent); color: var(--accent); font-weight: 700; }

    /* Scrollable Transcript Viewport */
    #transcript {
      flex: 1 1 auto;
      min-height: 60px;
      overflow-y: auto;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.45;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .line-stdout { white-space: pre-wrap; word-break: break-word; color: var(--text); }
    .line-stderr { white-space: pre-wrap; word-break: break-word; color: var(--err); font-weight: 500; }
    .line-cmd { white-space: pre-wrap; word-break: break-word; color: var(--cmd); font-weight: 700; }
    .line-prompt {
      background: var(--prompt-bg);
      color: var(--prompt-fg);
      border-left: 3px solid var(--accent);
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: 700;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Interactive Menu Pill Buttons inside Transcript */
    .menu-choice-btn {
      align-self: flex-start;
      background: var(--panel);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 6px 12px;
      font-family: ui-monospace, monospace;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      max-width: 100%;
    }
    .menu-choice-btn:active {
      background: var(--accent);
      color: var(--accent-fg);
    }

    /* 1-Tap Continue Bar for swirl "..." pauses */
    #continue-bar {
      display: none;
      background: var(--prompt-bg);
      color: var(--prompt-fg);
      border-top: 1px solid var(--accent);
      padding: 7px 12px;
      text-align: center;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      flex-shrink: 0;
    }

    /* Persistent Bottom Dock */
    .bottom-dock {
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      width: 100%;
    }

    /* Row 1: Dynamic Context Chips (Single non-overlapping horizontal scroll row) */
    #var-chips {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      flex-wrap: nowrap;
      white-space: nowrap;
      padding: 5px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bar-bg);
      scrollbar-width: none;
      min-height: 34px;
    }
    #var-chips::-webkit-scrollbar { display: none; }
    #var-chips:empty { display: none; }

    .var-chip {
      background: var(--chip-bg);
      color: var(--chip-fg);
      border: 1px solid var(--border);
      border-radius: 999px;
      height: 24px;
      padding: 0 10px;
      font-family: ui-monospace, monospace;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .var-chip:active { background: var(--accent); color: var(--accent-fg); }

    /* Row 2: Native Keyboard / Gboard Swipe Input Row */
    .input-row {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      gap: 6px;
      width: 100%;
    }
    #prompt-label {
      font-family: ui-monospace, monospace;
      color: var(--accent);
      font-weight: 800;
      font-size: 0.95rem;
      flex-shrink: 0;
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #r-input {
      flex: 1 1 auto;
      min-width: 0;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      height: 36px;
      padding: 0 10px;
      font-family: ui-monospace, monospace;
      font-size: 0.95rem;
      outline: none;
    }
    #r-input:focus { border-color: var(--accent); border-width: 1.5px; }

    #send-btn {
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: 6px;
      height: 36px;
      padding: 0 14px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Row 3: Primitive R & Math Operator Bar (Single horizontal scroll row) */
    .op-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;
      overflow-x: auto;
      flex-wrap: nowrap;
      white-space: nowrap;
      background: var(--bar-bg);
      border-top: 1px solid var(--border);
      scrollbar-width: none;
    }
    .op-bar::-webkit-scrollbar { display: none; }
    .op-bar.hidden { display: none; }

    .mode-toggle {
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: 5px;
      height: 32px;
      padding: 0 9px;
      font-family: ui-monospace, monospace;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .op-key {
      background: var(--key-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      min-width: 33px;
      height: 32px;
      padding: 0 6px;
      font-family: ui-monospace, monospace;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .op-key:active { background: var(--accent); color: var(--accent-fg); }

    /* Landscape / Short Viewport Optimization */
    @media (orientation: landscape) and (max-height: 520px) {
      header { height: 36px; padding: 0 8px; }
      .top-btn { height: 26px; font-size: 0.72rem; padding: 0 6px; }
      #transcript { padding: 6px 10px; font-size: 0.84rem; gap: 4px; }
      .input-row { padding: 4px 8px; }
      #r-input, #send-btn { height: 30px; font-size: 0.86rem; }
      .op-bar { padding: 3px 8px; }
      .op-key, .mode-toggle { height: 28px; min-width: 28px; font-size: 0.85rem; }
      #var-chips { padding: 3px 8px; min-height: 28px; }
    }

    /* Pop-Out Plot Modal Window with Pinch-to-Zoom */
    #plot-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .modal-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      max-width: 600px;
      max-height: 92dvh;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .modal-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    #plot-viewport {
      width: 100%;
      max-height: calc(92dvh - 50px);
      background: #ffffff;
      overflow: hidden;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #plot-canvas {
      width: 100%;
      height: auto;
      max-height: calc(92dvh - 50px);
      object-fit: contain;
      background: #ffffff;
      display: block;
      transform-origin: center center;
      will-change: transform;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-group">
      <span class="status-dot" id="status-dot" title="Engine Status"></span>
      <span class="brand">aaRgh</span>
    </div>
    <div class="top-actions">
      <button class="top-btn cmd-btn" disabled onclick="sendCommand('swirl()')">swirl()</button>
      <button class="top-btn cmd-btn" disabled onclick="sendCommand('play()')">play()</button>
      <button class="top-btn cmd-btn" disabled onclick="sendCommand('nxt()')">nxt()</button>
      <button class="top-btn cmd-btn" disabled onclick="sendCommand('skip()')">skip()</button>
      <button class="top-btn cmd-btn" disabled onclick="sendCommand('main()')">main()</button>
      <button class="top-btn cmd-btn" disabled onclick="sendCommand('bye()')">bye()</button>
      <button class="top-btn" id="plot-btn" onclick="togglePlotModal(true)">Plot</button>
      <button class="top-btn" id="keys-btn" onclick="toggleKeysBar()">Keys</button>
      <button class="top-btn" id="theme-btn" onclick="toggleTheme()">🌙 Dark</button>
    </div>
  </header>

  <div id="transcript">
    <div class="line-stdout" id="boot-status">Booting offline Base R (webR) &amp; unpacking swirl courses...</div>
  </div>

  <div id="continue-bar" onclick="sendCommand('')">... Tap here or press Enter to Continue ...</div>

  <div class="bottom-dock">
    <div id="var-chips"></div>
    <div class="input-row">
      <span id="prompt-label">&gt;</span>
      <input
        id="r-input"
        type="text"
        disabled
        autocapitalize="none"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        inputmode="text"
        enterkeyhint="send"
        placeholder="Wait for R engine..."
      />
      <button id="send-btn" disabled onpointerdown="event.preventDefault(); submitInput()">Send</button>
    </div>
    <div class="op-bar" id="op-bar">
      <button class="mode-toggle" id="mode-btn" disabled onpointerdown="event.preventDefault(); toggleOpMode()">[R]</button>
      <div id="op-keys-container" style="display:flex; gap:4px; flex-wrap:nowrap;"></div>
    </div>
  </div>

  <div id="plot-modal" onclick="if(event.target===this) togglePlotModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <span>R Graphics Output</span>
        <div class="modal-controls">
          <button class="top-btn" type="button" onclick="adjustPlotZoom(-0.25)">-</button>
          <button class="top-btn" type="button" id="zoom-readout" onclick="resetPlotZoom()">100%</button>
          <button class="top-btn" type="button" onclick="adjustPlotZoom(0.25)">+</button>
          <button class="top-btn" type="button" onclick="togglePlotModal(false)">Close</button>
        </div>
      </div>
      <div id="plot-viewport">
        <canvas id="plot-canvas" width="1008" height="1008"></canvas>
      </div>
    </div>
  </div>

  <script type="module">
    import { Console } from './webr/webr.mjs';

    // Logical grouping of primitive single characters (no redundant compound symbols)
    const R_KEYS    = ['<', '-', '|', '>', '$', '(', ')', '[', ']', '"', "'", ',', ':', '?', '_'];
    const MATH_KEYS = ['<', '>', '=', '!', '&', '|', '%', '*', '+', '-', '/', '^', '~'];
    let currentMode = 'R';
    let isEngineReady = false;
    let hasStartedSwirl = false;
    let isImeComposing = false;
    let lastBacktickedTokens = new Set();

    const transcript   = document.getElementById('transcript');
    const rInput       = document.getElementById('r-input');
    const sendBtn      = document.getElementById('send-btn');
    const modeBtn      = document.getElementById('mode-btn');
    const promptLabel  = document.getElementById('prompt-label');
    const continueBar  = document.getElementById('continue-bar');
    const varChips     = document.getElementById('var-chips');
    const plotModal    = document.getElementById('plot-modal');
    const plotViewport = document.getElementById('plot-viewport');
    const plotCanvas   = document.getElementById('plot-canvas');
    const plotBtn      = document.getElementById('plot-btn');
    const zoomReadout  = document.getElementById('zoom-readout');
    const statusDot    = document.getElementById('status-dot');

    // Lock / Unlock all input & command controls based on engine readiness
    function setEngineReady(ready) {
      isEngineReady = ready;
      rInput.disabled = !ready;
      sendBtn.disabled = !ready;
      modeBtn.disabled = !ready;
      document.querySelectorAll('.cmd-btn, .op-key, .var-chip').forEach((btn) => {
        btn.disabled = !ready;
      });
      if (ready) {
        statusDot.classList.add('ready');
        rInput.placeholder = 'Type or swipe R command...';
      } else {
        statusDot.classList.remove('ready');
        rInput.placeholder = 'Wait for R engine...';
      }
    }

    // Theme Management (Light Default, persisted on-device in localStorage & SharedPreferences)
    function loadInitialTheme() {
      try {
        if (window.AndroidBridge && typeof window.AndroidBridge.getThemeMode === 'function') {
          const nativeTheme = window.AndroidBridge.getThemeMode();
          if (nativeTheme === 'light' || nativeTheme === 'dark') return nativeTheme;
        }
      } catch (e) {}
      try {
        const stored = localStorage.getItem('aargh_theme');
        if (stored === 'light' || stored === 'dark') return stored;
      } catch (e) {}
      return 'light';
    }

    function setTheme(theme) {
      const normalized = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', normalized);
      try { localStorage.setItem('aargh_theme', normalized); } catch (e) {}
      try {
        if (window.AndroidBridge && typeof window.AndroidBridge.setThemeMode === 'function') {
          window.AndroidBridge.setThemeMode(normalized);
        }
      } catch (e) {}
      const btn = document.getElementById('theme-btn');
      if (btn) btn.textContent = normalized === 'light' ? '🌙 Dark' : '☀️ Light';
    }

    setTheme(loadInitialTheme());

    window.toggleTheme = () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'light';
      setTheme(cur === 'light' ? 'dark' : 'light');
    };

    window.toggleKeysBar = () => {
      document.getElementById('op-bar').classList.toggle('hidden');
    };

    // Preserve Gboard Swipe / Glide Composition while normalizing curly smart quotes
    function normalizeSmartQuotes() {
      if (isImeComposing) return;
      if (/[\u2018\u2019\u201C\u201D]/.test(rInput.value)) {
        const pos = rInput.selectionStart;
        rInput.value = rInput.value.replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"');
        try { rInput.setSelectionRange(pos, pos); } catch (e) {}
      }
    }

    rInput.addEventListener('compositionstart', () => {
      isImeComposing = true;
    });

    rInput.addEventListener('compositionend', () => {
      isImeComposing = false;
      normalizeSmartQuotes();
    });

    rInput.addEventListener('input', (e) => {
      if (e.isComposing || isImeComposing) return;
      normalizeSmartQuotes();
    });

    rInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing && !isImeComposing) {
        e.preventDefault();
        submitInput();
      }
    });

    function renderOpKeys() {
      const container = document.getElementById('op-keys-container');
      container.innerHTML = '';
      const keys = currentMode === 'R' ? R_KEYS : MATH_KEYS;
      keys.forEach(k => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'op-key';
        btn.disabled = !isEngineReady;
        btn.textContent = k;
        btn.onpointerdown = (e) => {
          e.preventDefault(); // Prevent losing keyboard/Gboard focus
          if (!isEngineReady) return;
          insertAtCursor(k);
        };
        container.appendChild(btn);
      });
    }

    window.toggleOpMode = () => {
      if (!isEngineReady) return;
      currentMode = currentMode === 'R' ? 'Math' : 'R';
      modeBtn.textContent = `[${currentMode}]`;
      renderOpKeys();
    };

    window.insertAtCursor = (text) => {
      if (!isEngineReady) return;
      const start = rInput.selectionStart ?? rInput.value.length;
      const end   = rInput.selectionEnd ?? rInput.value.length;
      const val   = rInput.value;
      rInput.value = val.slice(0, start) + text + val.slice(end);
      const nextPos = start + text.length;
      try { rInput.setSelectionRange(nextPos, nextPos); } catch (e) {}
      rInput.focus();
    };

    // Pop-Out Plot Modal with Pinch-to-Zoom & Pan
    let plotScale = 1;
    let plotTranslateX = 0;
    let plotTranslateY = 0;
    const activePointers = new Map();
    let initialPinchDistance = null;
    let initialPinchScale = 1;
    let lastPanX = null;
    let lastPanY = null;

    function updatePlotTransform() {
      if (plotScale <= 1) {
        plotScale = 1;
        plotTranslateX = 0;
        plotTranslateY = 0;
      }
      plotCanvas.style.transform = `translate(${plotTranslateX}px, ${plotTranslateY}px) scale(${plotScale})`;
      if (zoomReadout) zoomReadout.textContent = `${Math.round(plotScale * 100)}%`;
    }

    window.resetPlotZoom = () => {
      plotScale = 1;
      plotTranslateX = 0;
      plotTranslateY = 0;
      updatePlotTransform();
    };

    window.adjustPlotZoom = (delta) => {
      plotScale = Math.min(5, Math.max(1, plotScale + delta));
      updatePlotTransform();
    };

    window.togglePlotModal = (show) => {
      plotModal.style.display = show ? 'flex' : 'none';
      if (show) updatePlotTransform();
    };

    function getPointerDistance(p1, p2) {
      return Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
    }

    plotViewport.addEventListener('pointerdown', (e) => {
      activePointers.set(e.pointerId, e);
      plotViewport.setPointerCapture(e.pointerId);
      if (activePointers.size === 2) {
        const pts = Array.from(activePointers.values());
        initialPinchDistance = getPointerDistance(pts[0], pts[1]);
        initialPinchScale = plotScale;
      } else if (activePointers.size === 1) {
        lastPanX = e.clientX;
        lastPanY = e.clientY;
      }
    });

    plotViewport.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, e);
      if (activePointers.size === 2 && initialPinchDistance) {
        const pts = Array.from(activePointers.values());
        const dist = getPointerDistance(pts[0], pts[1]);
        plotScale = Math.min(5, Math.max(1, initialPinchScale * (dist / initialPinchDistance)));
        updatePlotTransform();
      } else if (activePointers.size === 1 && plotScale > 1 && lastPanX !== null && lastPanY !== null) {
        plotTranslateX += e.clientX - lastPanX;
        plotTranslateY += e.clientY - lastPanY;
        lastPanX = e.clientX;
        lastPanY = e.clientY;
        updatePlotTransform();
      }
    });

    function handlePointerUp(e) {
      activePointers.delete(e.pointerId);
      if (activePointers.size < 2) initialPinchDistance = null;
      if (activePointers.size === 1) {
        const rem = Array.from(activePointers.values())[0];
        lastPanX = rem.clientX;
        lastPanY = rem.clientY;
      } else {
        lastPanX = null;
        lastPanY = null;
      }
    }

    plotViewport.addEventListener('pointerup', handlePointerUp);
    plotViewport.addEventListener('pointercancel', handlePointerUp);
    plotViewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      window.adjustPlotZoom(e.deltaY < 0 ? 0.2 : -0.2);
    }, { passive: false });

    function appendLine(text, cls = 'line-stdout') {
      if (!text && cls !== 'line-cmd') return;
      const trimmed = text.trim();

      // Render numbered menu items (e.g. "1: R Programming") as clickable pill buttons
      const menuMatch = trimmed.match(/^(\d+):\s+(.+)$/);
      if (menuMatch && cls === 'line-stdout') {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'menu-choice-btn';
        btn.textContent = trimmed;
        btn.onclick = () => sendCommand(menuMatch[1]);
        transcript.appendChild(btn);
        transcript.scrollTop = transcript.scrollHeight;
        return;
      }

      const div = document.createElement('div');
      div.className = cls;
      div.textContent = text;
      transcript.appendChild(div);
      transcript.scrollTop = transcript.scrollHeight;

      // Extract backticked or single-quoted R identifiers for 1-tap chips
      const matches = text.match(/[`']([a-zA-Z][a-zA-Z0-9_.]*)[`']/g);
      if (matches) {
        matches.forEach(m => {
          const clean = m.slice(1, -1);
          if (clean.length > 1) lastBacktickedTokens.add(clean);
        });
        renderVarChips();
      }
    }

    function renderVarChips() {
      varChips.innerHTML = '';
      Array.from(lastBacktickedTokens).slice(-14).forEach(token => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'var-chip';
        chip.disabled = !isEngineReady;
        chip.textContent = token;
        chip.onpointerdown = (e) => {
          e.preventDefault();
          if (!isEngineReady) return;
          insertAtCursor(token);
        };
        varChips.appendChild(chip);
      });
    }

    renderOpKeys();
    setEngineReady(false);

    const webRConsole = new Console({
      stdout: (line) => appendLine(line, 'line-stdout'),
      stderr: (line) => appendLine(line, 'line-stderr'),
      prompt: (p) => {
        const cleanP = p.trim();

        // Unlock controls and auto-start swirl() once R emits its first ready prompt
        if (!hasStartedSwirl) {
          hasStartedSwirl = true;
          setEngineReady(true);
          webRConsole.stdin('swirl()\n');
          return;
        }

        if (cleanP === '...') {
          promptLabel.textContent = '...';
          rInput.placeholder = 'Press Enter or tap Continue...';
          continueBar.style.display = 'block';
        } else if (cleanP && cleanP !== '>' && cleanP !== '+') {
          // Display readline() questions (like "What shall I call you?" or "Selection:") in the transcript
          appendLine(cleanP, 'line-prompt');
          promptLabel.textContent = '?';
          rInput.placeholder = cleanP;
          continueBar.style.display = 'none';
        } else {
          promptLabel.textContent = cleanP || '>';
          rInput.placeholder = 'Type or swipe R command...';
          continueBar.style.display = 'none';
        }
        transcript.scrollTop = transcript.scrollHeight;
      },
      canvasImage: (img) => {
        const ctx = plotCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        plotBtn.classList.add('plot-ready');
        togglePlotModal(true);
      },
      canvasNewPage: () => {
        const ctx = plotCanvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, plotCanvas.width, plotCanvas.height);
      }
    }, {
      baseUrl: new URL('./webr/', window.location.href).href
    });

    window.sendCommand = (cmd) => {
      if (!isEngineReady) return;
      if (cmd !== '') {
        appendLine(`${promptLabel.textContent} ${cmd}`, 'line-cmd');
      }
      continueBar.style.display = 'none';
      webRConsole.stdin(cmd + '\n');
    };

    window.submitInput = () => {
      if (!isEngineReady) return;
      normalizeSmartQuotes();
      const cmd = rInput.value;
      rInput.value = '';
      window.sendCommand(cmd);
    };

    async function bootAaRgh() {
      try {
        await webRConsole.webR.init();
        const FS = webRConsole.webR.FS;

        // Mount on-device IDBFS at /persist so swirl progress stays on the phone
        try { await FS.mkdir('/persist'); } catch (e) {}
        try {
          await FS.mount('IDBFS', {}, '/persist');
          await FS.syncfs(true);
        } catch (e) {}

        // Fetch single tar bundle and unpack inside Base R
        const resp = await fetch('./aargh_payload.tar');
        if (!resp.ok) throw new Error('Could not fetch aargh_payload.tar');
        const buf = new Uint8Array(await resp.arrayBuffer());
        await FS.writeFile('/tmp/aargh_payload.tar', buf);

        await webRConsole.webR.evalRVoid(`
          options(device = webr::canvas)
          dir.create("/persist/aargh_bundle", recursive = TRUE, showWarnings = FALSE)
          dir.create("/persist/user_data", recursive = TRUE, showWarnings = FALSE)
          options(
            swirl_data_dir = "/persist/user_data",
            swirl_courses_dir = "/persist/aargh_bundle/courses"
          )
          utils::untar("/tmp/aargh_payload.tar", exdir = "/persist/aargh_bundle")
          unlink("/tmp/aargh_payload.tar")
          .aargh_root <- "/persist/aargh_bundle"
          source("/persist/aargh_bundle/swirl_offline_engine.R")
        `);

        try { await FS.syncfs(false); } catch (e) {}

        document.getElementById('boot-status').textContent =
          'Offline Base R Ready (' + (window.crossOriginIsolated ? 'SharedArrayBuffer Active' : 'Standard Mode') + '). Starting swirl...';

        // Start the interactive R Console loop
        webRConsole.run();
      } catch (err) {
        appendLine('Startup Error: ' + (err && err.message ? err.message : String(err)), 'line-stderr');
      }
    }

    bootAaRgh();
  </script>
</body>
</html>
